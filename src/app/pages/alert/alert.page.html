<app-header [titulo]="titulo() || 'Alert'"/>

<ion-content class="ion-padding">

  <h2>Alert normal</h2>
  <ion-button color="primary" expand="full" id="mostrar-alert">Mostrar Alert</ion-button>

  <ion-alert [backdropDismiss]="false" trigger="mostrar-alert" header="Título del alert" subHeader="Subtítulo"
             message="Esto es una alerta" [buttons]="botonesAlert"></ion-alert>

  <h2>Alert con Input</h2>
  <ion-button color="secondary" expand="full" id="mostrar-input">Mostrar Input</ion-button>

  <ion-alert [backdropDismiss]="false" trigger="mostrar-input" header="Alert con Input"
             subHeader="Inserte el nombre" [buttons]="botonesInput" [inputs]="inputs"></ion-alert>

  <h2>Alert con Radiobutton</h2>
  <ion-button id="mostrar-radio">Radio</ion-button>

  <ion-alert trigger="mostrar-radio"            header="Selecciona color"
             [buttons]="radioButtons" [inputs]="radioInputs"></ion-alert>


</ion-content>
