<app-header titulo="Slides"/>

<ion-content class="ion-padding">

  <swiper-container>
    @for (slide of slides; track $index){
      <swiper-slide class="slide-full">
        <ion-card mode="ios">
          <img [src]="slide.img" [alt]="slide.titulo" class="slide-image">
          <ion-card-header>
            <ion-card-title>
              {{slide.titulo}}
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>{{slide.desc}}</ion-card-content>
        </ion-card>
      </swiper-slide>
    }
  </swiper-container>

</ion-content>
