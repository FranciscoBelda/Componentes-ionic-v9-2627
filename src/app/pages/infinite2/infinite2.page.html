<app-header titulo="Infinite scroll v2"/>

<ion-content>

  <ion-list>
    @for (movie of movies(); track movie.id){
      <ion-item mode="ios">
        <ion-avatar slot="start">
          <img [src]="imageUrl + '/w92/'+movie.poster_path" alt="">
        </ion-avatar>
        <ion-label>
          {{movie.title}}
          <p>{{movie.release_date | date: 'y'}}</p>
        </ion-label>
        <ion-badge slot="end" color="success">{{movie.vote_average}}</ion-badge>
      </ion-item>
    }
  </ion-list>


  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles"
                                 loadingText="Loading more data..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
