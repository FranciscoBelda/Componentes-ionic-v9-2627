<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-text-center">Mi App</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button menu="primer-menu" color="tertiary"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-list-header color="tertiary">Mis componentes</ion-list-header>
    @for (componente of componentes(); track componente.nombre){
      <ion-item [routerLink]="componente.ruta">
        <ion-icon slot="start" [name]="componente.icono" color="tertiary"></ion-icon>
        <ion-label>{{componente.nombre}}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
