<ion-header class="ion-no-border">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center ion-text-capitalize">{{titulo()}}</ion-title>
    <ion-buttons slot="end">
      <ion-menu-toggle menu="primer-menu">
        <ion-button>
          <ion-avatar>
            <img loading="lazy" src="https://cdn-icons-png.flaticon.com/512/1079/1079176.png" alt="...">
          </ion-avatar>
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
