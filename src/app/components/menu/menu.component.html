<ion-menu side="end" menuId="primer-menu" contentId="principal">
  <ion-header>
    <ion-toolbar color="tertiary">
      <ion-title>Menú principal</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      @for (componente of componentes(); track componente.nombre){
        <ion-menu-toggle menu="primer-menu">
          <ion-item [routerLink]="componente.ruta">
            <ion-icon color="tertiary" [name]="componente.icono" slot="start"></ion-icon>
            <ion-label>{{componente.nombre}}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>
  </ion-content>
</ion-menu>
